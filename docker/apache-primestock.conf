# Prime Stock has index.php in the repository root. Deny direct HTTP access to
# Laravel source/configuration directories while allowing the app's root assets.
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes -MultiViews
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|documentation|resources|routes|storage|vendor)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(artisan|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|vite\.config\.js|tailwind\.config\.js|postcss\.config\.js|\.env.*)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
